stages:
  - basicSetup
  - buildImage
  - pushImage
  - deployToStaging
  - deployToProd
basicSetup:
  stage: basicSetup
  script:
    - whoami
    - pwd
    - cat /etc/os-release
    - curl -4 ifconfig.me
buildImage:
  stage: buildImage
  script:
    - docker image ls
    - docker compose -f docker-compose.yaml build
    - docker image ls
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

pushImage:
  stage: pushImage
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker compose -f docker-compose.yaml push
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'


checkVariables:
  stage: basicSetup
  script:
    - |
      echo "========== GITLAB REF CHECK =========="

      echo "Branch: $CI_COMMIT_BRANCH"
      echo "Protected ref: $CI_COMMIT_REF_PROTECTED"

      echo "========== SSH VARIABLE CHECK =========="

      if [ -n "${SSH_PRIVATE_KEY:-}" ]; then
        echo "SSH_PRIVATE_KEY: AVAILABLE"

        if [ -f "$SSH_PRIVATE_KEY" ]; then
          echo "SSH_PRIVATE_KEY file exists"
        else
          echo "SSH_PRIVATE_KEY file does not exist"
        fi
      else
        echo "SSH_PRIVATE_KEY: EMPTY"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'


# ==========================================
# 4. DEPLOY TO STAGING SERVER
# ==========================================


deployToStaging:
  stage: deployToStaging

  needs:
    - pushImage

  environment:
    name: staging
    url: https://staging-nov18.oklabs.in

  resource_group: staging

  script:
    - echo "Deploying application to staging server..."
    
    # Define image (must match docker-compose.yaml)
    - 'echo "Docker Image Account: $CI_REGISTRY_IMAGE"'
    - IMAGE="${CI_REGISTRY_IMAGE}/myservice1:t${CI_PIPELINE_IID}"
    - 'echo "Docker Image: $IMAGE"'

    # 1. Login to Docker Registry on staging server
    - ssh $DEPLOY_USER@$STAGING_HOST "docker login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD"

    # 2. Pull latest Docker image
    - ssh $DEPLOY_USER@$STAGING_HOST "docker pull $IMAGE"

    # 3. Remove existing container
    - ssh $DEPLOY_USER@$STAGING_HOST "docker rm -f oklabs-app || true"

    # 4. Start new container
    - ssh $DEPLOY_USER@$STAGING_HOST "docker run -d --name oklabs-app --restart unless-stopped --network host -v oklabs-letsencrypt:/etc/letsencrypt -v oklabs-letsencrypt-lib:/var/lib/letsencrypt  $IMAGE"

    - echo "Staging deployment completed successfully!"

  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'


# ==========================================
# 5. DEPLOY TO PRODUCTION SERVER
# ==========================================

deployToProd:
  stage: deployToProd

  needs:
    - deployToStaging

  environment:
    name: production
    url: https://prod-nov18.oklabs.in

  resource_group: production

  script:
    - echo "Deploying application to production server..."

    # 1. Login to Docker Registry on production server
    - |
      printf '%s' "$CI_REGISTRY_PASSWORD" | ssh "$DEPLOY_USER@$PROD_HOST" \
        "docker login '$CI_REGISTRY' \
        -u '$CI_REGISTRY_USER' \
        --password-stdin"

        echo "========== IMAGE DEBUG =========="
      echo "CI_REGISTRY_IMAGE: ${CI_REGISTRY_IMAGE:-EMPTY}"
      echo "CI_PIPELINE_IID: ${CI_PIPELINE_IID:-EMPTY}"

      IMAGE="${CI_REGISTRY_IMAGE}/myservice1:t${CI_PIPELINE_IID}"

      echo "IMAGE: $IMAGE"

      if [ -z "${CI_REGISTRY_IMAGE:-}" ]; then
        echo "ERROR: CI_REGISTRY_IMAGE is empty"
        exit 1
      fi

      if [ -z "${CI_PIPELINE_IID:-}" ]; then
        echo "ERROR: CI_PIPELINE_IID is empty"
        exit 1
      fi
    # 2. Pull the same image deployed to staging
    - ssh "$DEPLOY_USER@$PROD_HOST" "docker pull '$IMAGE'"

    # 3. Remove existing production container
    - ssh "$DEPLOY_USER@$PROD_HOST" "docker rm -f oklabs-app || true"

    # 4. Start new production container
    - |
      ssh "$DEPLOY_USER@$PROD_HOST" "
        docker run -d \
          --name oklabs-app \
          --restart unless-stopped \
          --network host \
          -v /opt/oklabs-prod/.env:/var/www/.env:ro \
          -v oklabs-letsencrypt:/etc/letsencrypt \
          -v oklabs-letsencrypt-lib:/var/lib/letsencrypt \
          '$IMAGE'
      "

    - echo "Production deployment completed successfully!"

  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

