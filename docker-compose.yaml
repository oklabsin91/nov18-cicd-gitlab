services:
  myservie1:
    image: "${CI_REGISTRY_IMAGE}/myservice1:t${CI_PIPELINE_IID}"  
    build:
      context: .
      dockerfile: Dockerfile
    
    network_mode: host
    
    volumes:
      - letsencrypt:/etc/letsencrypt
      - letsencrypt-lib:/var/lib/letsencrypt
      - letsencrypt-log:/var/log/letsencrypt

volumes:
  letsencrypt:
  letsencrypt-lib:
  letsencrypt-log:
