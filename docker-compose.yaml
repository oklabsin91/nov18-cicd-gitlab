services:
  myservie1:
    image: "${CI_REGISTRY_IMAGE}/myservice1:t${CI_PIPELINE_IID}"  
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env

    #environment:
    #  APP_ENV: production
    #  NODE_ENV: production
    #  FQDN: staging-nov18.oklabs.in
    #  PORT: 80
    
    network_mode: host
    
    #ports:
    #  - "80:80"
    #  - "443:443"
    
    volumes:
      - letsencrypt:/etc/letsencrypt
      - letsencrypt-lib:/var/lib/letsencrypt
      - letsencrypt-log:/var/log/letsencrypt

volumes:
  letsencrypt:
  letsencrypt-lib:
  letsencrypt-log:
